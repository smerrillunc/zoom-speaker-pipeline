[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zoompipe"
version = "1.0.0"
description = "Named-speaker transcripts from Zoom-style meeting recordings"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["rapidfuzz>=3.0"]

[project.optional-dependencies]
ocr = ["numpy", "opencv-contrib-python-headless", "paddlepaddle", "paddleocr", "paddlex[ocr]"]
asr = ["faster-whisper", "torch", "torchaudio", "pyannote.audio", "huggingface_hub"]

[tool.setuptools]
packages = ["zoompipe"]
